name: Encrypted Supabase backup
on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 0"
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: aws-0-ap-northeast-2.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.phbfqxqtkbxefhgwsfxd
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_EVIDENCE_BUCKET: ${{ secrets.SUPABASE_EVIDENCE_BUCKET }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check backup configuration
        run: test -n "$PGPASSWORD" && test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$SUPABASE_EVIDENCE_BUCKET" && test -n "$AGE_RECIPIENT"
      - name: Install backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Export database and evidence
        run: |
          mkdir -p .backup/database .backup/evidence
          pg_dump --format=custom --no-owner --no-acl --file=.backup/database/fraus.dump
          node scripts/backup-evidence.mjs .backup/evidence
          tar -C .backup -czf fraus-backup.tar.gz database evidence
          age -r "$AGE_RECIPIENT" -o fraus-backup.tar.gz.age fraus-backup.tar.gz
          rm -rf .backup fraus-backup.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fraus-encrypted-backup-${{ github.run_id }}
          path: fraus-backup.tar.gz.age
          retention-days: 30
          if-no-files-found: error
