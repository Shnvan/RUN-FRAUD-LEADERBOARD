name: Encrypted Supabase backup
on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 0"
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_EVIDENCE_BUCKET: ${{ secrets.SUPABASE_EVIDENCE_BUCKET }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check backup configuration
        run: test -n "$SUPABASE_DB_URL" && test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$SUPABASE_EVIDENCE_BUCKET" && test -n "$AGE_RECIPIENT"
      - name: Install backup tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Export database and evidence
        run: |
          mkdir -p .backup/database .backup/evidence
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --file=.backup/database/fraus.dump
          node scripts/backup-evidence.mjs .backup/evidence
          tar -C .backup -czf fraus-backup.tar.gz database evidence
          age -r "$AGE_RECIPIENT" -o fraus-backup.tar.gz.age fraus-backup.tar.gz
          rm -rf .backup fraus-backup.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fraus-encrypted-backup-${{ github.run_id }}
          path: fraus-backup.tar.gz.age
          retention-days: 30
          if-no-files-found: error
